    <style>
     body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 20px;

  /* Yazılar daha okunaklı olsun */
  color: #222;
}




/* ====== ANTİK ARKA PLAN (ZORLA) ====== */
body {
 
    background-size: cover !important;
    background-position: center !important;
    background-repeat: no-repeat !important;
    background-attachment: fixed !important;
}




        h1, h2 { text-align: center; }
        section { margin-bottom: 50px; }

        /* ====== Tavsiye Kartları (Yatay) ====== */
        .tavsiye-cards {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
            justify-content: center;
        }
        .tavsiye-card {
            display: flex;
            flex-direction: column;
            background-color: white;
            width: 200px;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .tavsiye-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }

        /* ====== Antik Şehir Kartları (Dikey) ====== */
        .antik-cards {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
        }
        .antik-card {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .antik-card img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        /* ====== Form ====== */
        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 400px;
            margin: 20px auto;
        }
        input, textarea, button {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            cursor: pointer;
            background-color: #007BFF;
            color: white;
            border: none;
            transition: background-color 0.3s;
        }
        button:hover { background-color: #0056b3; }
    </style>

    <h1>🌍 Tavsiye ve Antik Şehirler</h1>

    <!-- Tavsiyeler -->
    <section>
        <h2>Tavsiyeler</h2>
        <div style="text-align:center;">
            <button onclick="getTavsiyeler('kitap')">Kitap</button>
            <button onclick="getTavsiyeler('film')">Film</button>
            <button onclick="getTavsiyeler('belgesel')">Belgesel</button>
            
        </div>

        <div id="cards" class="tavsiye-cards card-relative"></div>

        <!-- Tavsiye ekleme formu -->
        <h3>Yeni Tavsiye Ekle</h3>
       <form id="tavsiye-form">
    <input type="text" name="baslik" placeholder="Başlık" required>

    <textarea name="aciklama" placeholder="Açıklama" required></textarea>

    <select name="kategori" id="kategori" required>
        <option value="kitap">Kitap</option>
        <option value="film">Film</option>
        <option value="belgesel">Belgesel</option>
    </select>

    <input type="text" name="imdb" id="imdb" placeholder="IMDB puanı (sadece film)">

    <button type="submit">Ekle</button>
</form>

    </section>

    <!-- Antik Şehirler -->
    <section>
        <h2>Antik Şehirler</h2>
        <div style="text-align:center;">
            <button onclick="getAntikSehirler()">Göster</button>
        </div>
        <div id="antik-cards" class="antik-cards"></div>
    </section>

    <script src="script.js"></script>
